name: Publish visit stats

on:
  schedule:
    # GitHub / Gitee 的访问数据本身就是按小时/天聚合，15 分钟足够保持可用。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-visit-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GITEE_OWNER: meiliwang0808
      GITEE_REPO: novae-releases
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch GitHub and Gitee project page views
        run: |
          set -euo pipefail
          mkdir -p stats

          GH_JSON="$(curl --http1.1 --connect-timeout 20 --max-time 60 -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TRAFFIC_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO}/traffic/views" || true)"
          if [ -z "$GH_JSON" ]; then
            GH_JSON='{}'
          fi
          GH_COUNT="$(printf '%s' "$GH_JSON" | jq -r '.count // 0' 2>/dev/null || echo 0)"
          GH_ERROR="$(printf '%s' "$GH_JSON" | jq -r '.message // empty' 2>/dev/null || true)"

          GITEE_JSON="$(curl --http1.1 --connect-timeout 20 --max-time 60 -fsS \
            -X POST \
            -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/traffic-data" || true)"
          if [ -z "$GITEE_JSON" ]; then
            GITEE_JSON='{}'
          fi
          GITEE_COUNT="$(printf '%s' "$GITEE_JSON" | jq -r '.summary.ip // 0' 2>/dev/null || echo 0)"
          GITEE_ERROR="$(printf '%s' "$GITEE_JSON" | jq -r '.message // empty' 2>/dev/null || true)"

          if ! [[ "$GH_COUNT" =~ ^[0-9]+$ ]]; then GH_COUNT=0; GH_ERROR="GitHub 返回格式异常"; fi
          if ! [[ "$GITEE_COUNT" =~ ^[0-9]+$ ]]; then GITEE_COUNT=0; GITEE_ERROR="Gitee 返回格式异常"; fi
          if [ -n "$GH_ERROR" ] || [ -n "$GITEE_ERROR" ]; then
            PARTIAL=true
          else
            PARTIAL=false
          fi
          TOTAL=$((GH_COUNT + GITEE_COUNT))
          UPDATED="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          jq -n --argjson github "$GH_COUNT" --argjson gitee "$GITEE_COUNT" --argjson total "$TOTAL" --argjson partial "$PARTIAL" --arg updatedAt "$UPDATED" --arg githubError "$GH_ERROR" --arg giteeError "$GITEE_ERROR" '{snapshot:1,updatedAt:$updatedAt,github:$github,gitee:$gitee,total:$total,githubWindow:"近 14 天",giteeWindow:"近 7 天",partial:$partial,giteeAvailable:($giteeError == ""),note:"GitHub / Gitee 项目页访问次数（含仓库下各页面）"} + (if $githubError != "" then {githubError:$githubError} else {} end) + (if $giteeError != "" then {giteeError:$giteeError} else {} end)' > stats/visits.json

          cat stats/visits.json

      - name: Commit to GitHub main
        run: |
          set -euo pipefail
          git config user.name "novae-visit-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add stats/visits.json
          if git diff --cached --quiet; then
            echo "Visit stats unchanged"
          else
            git commit -m "chore: update project visit stats"
            git push origin HEAD:main
          fi

      - name: Mirror stats to Gitee
        run: |
          set -euo pipefail
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git push --force gitee HEAD:main
