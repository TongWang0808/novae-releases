name: Publish visit stats

on:
  schedule:
    # GitHub / Gitee 的访问数据按小时/天聚合，15 分钟足够保持累计账本最新。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-visit-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GITEE_OWNER: meiliwang0808
      GITEE_REPO: novae-releases
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch GitHub and Gitee project page views
        run: |
          set -euo pipefail
          mkdir -p stats
          rm -f /tmp/novae-gh-traffic.json /tmp/novae-gitee-traffic.json

          # 不使用 jq：解析交给 Python，避免多行表达式在 runner 上被拆坏。
          curl --http1.1 --connect-timeout 20 --max-time 60 -sS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TRAFFIC_TOKEN}" \
            -o /tmp/novae-gh-traffic.json \
            "https://api.github.com/repos/${GH_REPO}/traffic/views" || true

          curl --http1.1 --connect-timeout 20 --max-time 60 -sS \
            -X POST \
            -H "Authorization: token ${GITEE_TOKEN}" \
            -o /tmp/novae-gitee-traffic.json \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/traffic-data" || true

          if [ ! -s /tmp/novae-gh-traffic.json ]; then
            printf '{}' > /tmp/novae-gh-traffic.json
          fi
          if [ ! -s /tmp/novae-gitee-traffic.json ]; then
            printf '{}' > /tmp/novae-gitee-traffic.json
          fi

          # Abacus 的使用人数 counter 是公共免账号计数器；每 15 分钟读一次，
          # 既保持它在 6 个月 TTL 内不失效，也不增加计数。
          curl --http1.1 --connect-timeout 15 --max-time 30 -sS \
            "https://abacus.jasoncameron.dev/get/novae-releases/installs" >/dev/null || true

          export GH_TRAFFIC_JSON=/tmp/novae-gh-traffic.json
          export GITEE_TRAFFIC_JSON=/tmp/novae-gitee-traffic.json
          python3 tools/update_visit_ledger.py

      - name: Commit to GitHub main
        run: |
          set -euo pipefail
          git config user.name "novae-visit-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add stats/visits.json stats/traffic-ledger.json
          if git diff --cached --quiet; then
            echo "Visit stats unchanged"
          else
            git commit -m "chore: update lifetime visit stats"
            git push origin HEAD:main
          fi

      - name: Mirror stats to Gitee
        run: |
          set -euo pipefail
          mirror_file() {
            local file_path="$1"
            local sha=""
            sha="$(curl --http1.1 --connect-timeout 20 --max-time 45 -sS \
              -H "Authorization: token ${GITEE_TOKEN}" \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${file_path}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)"
            local content
            content="$(base64 -w0 "$file_path")"
            local body
            if [ -n "$sha" ]; then
              body="{\"access_token\":\"${GITEE_TOKEN}\",\"content\":\"${content}\",\"message\":\"chore: update lifetime visit stats\",\"sha\":\"${sha}\"}"
              curl --http1.1 --connect-timeout 20 --max-time 60 -sS -X PUT \
                -H "Content-Type: application/json" \
                -d "$body" \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${file_path}" >/dev/null || true
            else
              body="{\"access_token\":\"${GITEE_TOKEN}\",\"content\":\"${content}\",\"message\":\"chore: update lifetime visit stats\",\"branch\":\"main\"}"
              curl --http1.1 --connect-timeout 20 --max-time 60 -sS -X POST \
                -H "Content-Type: application/json" \
                -d "$body" \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${file_path}" >/dev/null || true
            fi
          }
          mirror_file "stats/visits.json"
          mirror_file "stats/traffic-ledger.json"
          echo "Gitee mirror completed"
