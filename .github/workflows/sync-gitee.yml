name: Sync to Gitee

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - README.md
  release:
    types: [published]
  schedule:
    # Fallback polling in case a release event is missed.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.2. Leave empty to use the latest release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

jobs:
  readme:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITEE_OWNER: meiliwang0808
      GITEE_REPO: novae-releases
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Mirror README.md to Gitee
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/README.md"

          base64 -w0 README.md > gh-readme.b64

          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 60 -fsSL \
            "${API}?access_token=${GITEE_TOKEN}" -o gitee-readme.json

          CUR_SHA="$(jq -r '.sha // empty' gitee-readme.json)"
          jq -r '.content // empty' gitee-readme.json | tr -d '\n\r ' > gitee-readme.b64

          if [ -n "$CUR_SHA" ] && cmp -s gh-readme.b64 gitee-readme.b64; then
            echo "README already in sync"
            exit 0
          fi

          if [ -n "$CUR_SHA" ]; then
            jq -n --arg message "docs: sync README from GitHub" \
              --rawfile content gh-readme.b64 --arg sha "$CUR_SHA" --arg branch main \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > payload.json
          else
            jq -n --arg message "docs: sync README from GitHub" \
              --rawfile content gh-readme.b64 --arg branch main \
              '{message:$message,content:$content,branch:$branch}' > payload.json
          fi

          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 60 -fsSL -X PUT \
            -H 'Content-Type: application/json' --data-binary @payload.json \
            "${API}?access_token=${GITEE_TOKEN}" -o result.json

          echo "Gitee README commit: $(jq -r '.commit.sha // "unknown"' result.json)"

  check:
    if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.precheck.outputs.skip }}
      tag: ${{ steps.precheck.outputs.tag }}
    env:
      GITEE_OWNER: meiliwang0808
      GITEE_REPO: novae-releases
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check whether this release is already fully synced
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"

          # A tag push can arrive before the Release is published; wait up to 60 seconds.
          FOUND=false
          for i in $(seq 1 12); do
            if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
              FOUND=true
              break
            fi
            echo "Release $TAG is not visible yet; waiting 5s ($i/12)"
            sleep 5
          done
          if [ "$FOUND" != "true" ]; then
            echo "Release $TAG is not published yet; skip this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          REL_JSON="$(curl --http1.1 --connect-timeout 20 --max-time 60 -fsS "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" || true)"
          if [ -z "$REL_JSON" ] || [ "$REL_JSON" = "null" ]; then
            echo "Gitee release missing; sync needed"
            exit 0
          fi
          REL_ID="$(printf '%s' "$REL_JSON" | jq -r '.id // empty')"
          if [ -z "$REL_ID" ] || [ "$REL_ID" = "null" ]; then
            echo "Gitee release id missing; sync needed"
            exit 0
          fi

          MANIFEST="$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/latest-gitee.json" || true)"
          MANIFEST_VERSION="$(printf '%s' "$MANIFEST" | jq -r '.version // empty' 2>/dev/null || true)"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Manifest is not $VERSION; sync needed"
            exit 0
          fi

          SZ="$(gh release view "$TAG" --json assets -q '.assets[] | select(.name == "novae.exe") | .size' | head -1)"
          if [ -z "$SZ" ]; then
            echo "GitHub release has no novae.exe; sync needed"
            exit 0
          fi
          # The 51MB exe is uploaded by the local Novae sync task. Do not re-upload it here.
          echo "Gitee release and manifest are current; local task owns asset upload"
          echo "skip=true" >> "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GITEE_OWNER: meiliwang0808
      GITEE_REPO: novae-releases
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release and generate manifests
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check.outputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          VERSION="${TAG#v}"
          gh release view "$TAG" --json tagName,name,body,publishedAt,assets > release.json

          ASSET="$(jq -r '.assets[] | select(.name == "novae.exe") | .name' release.json | head -1)"
          if [ -z "$ASSET" ]; then
            ASSET="$(jq -r '.assets[] | select(.name | endswith(".exe")) | .name' release.json | head -1)"
          fi
          if [ -z "$ASSET" ]; then
            echo "Release $TAG has no .exe asset" >&2
            exit 1
          fi

          mkdir -p dist
          gh release download "$TAG" --pattern "$ASSET" --dir dist --clobber
          if [ ! -f "dist/$ASSET" ]; then
            echo "Downloaded asset not found: dist/$ASSET" >&2
            exit 1
          fi

          SIZE="$(stat -c%s "dist/$ASSET")"
          SHA="$(sha256sum "dist/$ASSET" | awk '{print $1}')"
          NOTES="$(jq -r '.body // ""' release.json)"
          PUBLISHED="$(jq -r '.publishedAt // ""' release.json)"

          GH_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          GITEE_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}/${ASSET}"

          jq -n \
            --arg version "$VERSION" \
            --arg publishedAt "$PUBLISHED" \
            --arg notes "$NOTES" \
            --arg url "$GH_URL" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            '{version:$version,publishedAt:$publishedAt,notes:$notes,assets:{"windows-amd64":{url:$url,sha256:$sha256,size:$size}}}' \
            > latest.json

          jq -n \
            --arg version "$VERSION" \
            --arg publishedAt "$PUBLISHED" \
            --arg notes "$NOTES" \
            --arg url "$GITEE_URL" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            '{version:$version,publishedAt:$publishedAt,notes:$notes,assets:{"windows-amd64":{url:$url,sha256:$sha256,size:$size}}}' \
            > latest-gitee.json

          jq -n \
            --arg tag "$TAG" \
            --arg name "Novae ${VERSION}" \
            --arg body "$NOTES" \
            --arg target "main" \
            '{tag_name:$tag,name:$name,body:$body,target_commitish:$target,prerelease:false}' \
            > gitee-release.json

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Commit manifests to GitHub main
        run: |
          set -euo pipefail
          git config user.name "novae-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add latest.json latest-gitee.json
          if git diff --cached --quiet; then
            echo "Manifests already up to date"
          else
            git commit -m "chore: publish ${{ steps.release.outputs.tag }} manifests"
            git push origin HEAD:main
          fi

      # Do not mirror the whole repository with `git push --force`.
      # Gitee rejects force-pushes to main with `incorrect old value provided`;
      # README is synced by the `readme` job via the Gitee API, and the release
      # API creates any missing tag from `target_commitish` below.

      - name: Create or update Gitee release
        id: gitee_release
        continue-on-error: true
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          TAG="${{ steps.release.outputs.tag }}"
          REL_JSON="$(curl --http1.1 --connect-timeout 20 --max-time 120 -fsS "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" || true)"
          if [ -z "$REL_JSON" ] || [ "$REL_JSON" = "null" ]; then
            REL_JSON="$(curl --http1.1 --connect-timeout 20 --max-time 120 -fsS -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @gitee-release.json \
              "${API}/releases?access_token=${GITEE_TOKEN}")"
          fi
          REL_ID="$(printf '%s' "$REL_JSON" | jq -r '.id')"
          if [ -z "$REL_ID" ] || [ "$REL_ID" = "null" ]; then
            echo "Could not resolve Gitee release id" >&2
            exit 1
          fi
          echo "release_id=$REL_ID" >> "$GITHUB_OUTPUT"

          # The 51MB exe is uploaded by the local Novae Gitee sync task.

      - name: Verify Gitee release asset
        continue-on-error: true
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          REL_ID="${{ steps.gitee_release.outputs.release_id }}"
          ATT_JSON="$(curl --http1.1 --connect-timeout 20 --max-time 60 -fsS "${API}/releases/${REL_ID}/attach_files?access_token=${GITEE_TOKEN}")"
          URL="$(printf '%s' "$ATT_JSON" | jq -r '.[0].browser_download_url // empty')"
          if [ -z "$URL" ]; then
            echo "::warning::Gitee asset not uploaded yet; the local sync task will upload it."
            exit 0
          fi
          echo "Gitee asset: $URL"

