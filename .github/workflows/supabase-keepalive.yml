name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Novae usage counter
        env:
          SUPABASE_URL: https://rknetrmcfwrolfrgjoiz.supabase.co
          SUPABASE_KEY: sb_publishable_tTgoX2sVh5pYkaoxXhssuA_n_pkhBE_
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/rpc/novae_usage_get" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase keepalive HTTP $code"
          test "$code" = "200"
